openapi: 3.0.3

info: 
  title: Generator Icon Script API
  description: API для роботи з іконками, обраними та оцінками користувачів.
  version: 1.0.0

servers:
  - url: http://localhost/Generator%20Icon%20Script/php/

Файли:



  - favorite.php:
      API-операції: Додати/видалити обране
      Метод: POST
/**
 * Додає або видаляє іконку зі списку обраного користувача.
 *
 * @param int $icon_id Ідентифікатор іконки.
 * @return void JSON-відповідь з результатом виконаної операції.
 *
 * @response 200 Іконку успішно додано до обраного.
 * @response 200 Іконку успішно видалено з обраного.
 * @response 200 Користувач не авторизований.
 *
 * Приклад успішної відповіді:
 * {"status":"added"}
 *
 * Приклад відповіді при видаленні:
 * {"status":"removed"}
 */




  - rate.php:
      API-операції: Додати/змінити/видалити оцінку
      Метод: POST
/**
 * Додає, змінює або видаляє оцінку користувача для іконки.
 *
 * @param int $icon_id Ідентифікатор іконки.
 * @param int $rating Оцінка іконки. Значення 0 видаляє існуючу оцінку.
 * @return void JSON-відповідь з результатом виконаної операції.
 *
 * @response 200 Оцінку успішно додано, змінено або видалено.
 * @response 200 Користувач не авторизований.
 * @response 200 Передано некоректний ідентифікатор іконки.
 * @response 200 Під час роботи з базою даних виникла помилка.
 *
 * Приклад успішної відповіді:
 * {"status":"success"}
 *
 * Приклад помилки авторизації:
 * {"status":"error","message":"Авторизуйтесь"}
 *
 * Приклад некоректного ID:
 * {"status":"error","message":"Некоректний ID"}
 */

  - download-svg.php:
      API-операції: Завантажити SVG
      Метод: GET 
//**
