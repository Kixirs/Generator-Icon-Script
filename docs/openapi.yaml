  - admin.php:
      API-операції:  Видалити іконку
      Метод: POST
/**
 * Видаляє іконку з каталогу.
 *
 * @param int $delete_icon_id Ідентифікатор іконки, яку необхідно видалити.
 * @return void JSON-відповідь з результатом операції.
 *
 * @response 200 Іконку успішно видалено.
